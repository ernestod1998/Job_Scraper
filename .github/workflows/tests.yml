name: Tests

# Secret-free tests with offline fixtures; setup downloads test dependencies. Deliberately path-filtered: the
# watchers push ~30 chore commits a day and none of them should burn CI minutes
# here. The workflow paths are included so that reintroducing a hand-rolled
# rebase-and-push tail in any watcher trips the recurrence guard in
# test_ci_commit_push.py. (Written that way on purpose — the guard greps these
# files for the literal git commands, including this one.)
on:
  push:
    paths:
      - ci_commit_push.py
      - test_ci_commit_push.py
      - scrape_jobs.py
      - ats_registry.py
      - ats_registry.json
      - discover.py
      - test_scraper_core.py
      - test_ats_registry.py
      - test_dates.py
      - test_dates.mjs
      - test_dashboard.mjs
      - triage.html
      - assets/triage/**
      - browser-tests/**
      - test_decisions.mjs
      - test_feeds.mjs
      - test_source_health.py
      - package.json
      - package-lock.json
      - playwright.config.mjs
      - .github/workflows/*.yml
  pull_request:
    paths:
      - ci_commit_push.py
      - test_ci_commit_push.py
      - scrape_jobs.py
      - ats_registry.py
      - ats_registry.json
      - discover.py
      - test_scraper_core.py
      - test_ats_registry.py
      - test_dates.py
      - test_dates.mjs
      - test_dashboard.mjs
      - triage.html
      - assets/triage/**
      - browser-tests/**
      - test_decisions.mjs
      - test_feeds.mjs
      - test_source_health.py
      - package.json
      - package-lock.json
      - playwright.config.mjs
      - .github/workflows/*.yml
  workflow_dispatch:

jobs:
  tests:
    name: Scraper and local dashboard tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The end-to-end race tests build a throwaway bare repo and commit into
      # it, so git needs an identity on the runner.
      - name: Configure git identity
        run: |
          git config --global user.name  "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Run tests
        run: python test_ci_commit_push.py

      # Posted dates must mean a Pacific calendar day, not the runner's UTC day.
      # Includes recurrence guards that inspect scraper and dashboard date helpers for
      # the UTC-day idioms that caused the 2026-07-28 future-dated postings.
      - name: Posted-date normalization tests
        run: python test_dates.py

      - name: Scraper policy and retrieval tests
        run: python test_scraper_core.py

      - name: ATS registry tests
        run: python test_ats_registry.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Source health regressions
        run: python test_source_health.py

      - name: Install browser test dependencies
        run: npm ci

      - name: Dashboard unit and policy tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance tests
        run: npm run test:browser
