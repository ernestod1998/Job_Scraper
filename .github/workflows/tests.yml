name: Tests

# Fast, secret-free, no-network unit tests. Deliberately path-filtered: the
# watchers push ~30 chore commits a day and none of them should burn CI minutes
# here. The workflow paths are included so that reintroducing a hand-rolled
# rebase-and-push tail in any watcher trips the recurrence guard in
# test_ci_commit_push.py. (Written that way on purpose — the guard greps these
# files for the literal git commands, including this one.)
on:
  push:
    paths:
      - ci_commit_push.py
      - test_ci_commit_push.py
      - triage.html
      - sync/**
      - .github/workflows/*.yml
  pull_request:
    paths:
      - ci_commit_push.py
      - test_ci_commit_push.py
      - triage.html
      - sync/**
      - .github/workflows/*.yml
  workflow_dispatch:

jobs:
  tests:
    name: Commit/push + triage merge tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The end-to-end race tests build a throwaway bare repo and commit into
      # it, so git needs an identity on the runner.
      - name: Configure git identity
        run: |
          git config --global user.name  "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Run tests
        run: python test_ci_commit_push.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # triage.html carries an inline copy of the triage merge rules and
      # sync/merge.js carries the server's. This extracts the browser's copy and
      # asserts the two agree — silent drift between them would corrupt triage
      # data, which is the failure this whole feature exists to prevent. No
      # dependencies, no network.
      - name: Triage merge-rule parity
        run: node sync/merge.test.mjs
