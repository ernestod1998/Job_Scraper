name: ZipRecruiter + Google Watcher

on:
  schedule:
    # Twice daily (~8am and ~4pm PT). These boards are day-resolution like
    # Indeed, so a higher cadence just burns runs; offset minutes to avoid
    # the other watchers on the commit-push concurrency group.
    - cron: "7 15,23 * * *"
  workflow_dispatch:

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  scrape:
    name: ZipRecruiter + Google scrape
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Scrape ZipRecruiter + Google (last 24h)
        run: python scrape_jobs.py --boards-only
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NOTIFY_TERMS: ${{ vars.NOTIFY_TERMS }}

      - name: Record workflow run
        run: |
          python - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone

          with open("boards_jobs.json", encoding="utf-8") as f:
              data = json.load(f)

          entry = {
              "workflow": "boards",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "job_count": int(data.get("total", 0)),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }

          with open("workflow_runs.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(entry, sort_keys=True) + "\n")
          EOF

      - name: Commit results to repo
        run: |
          git config user.name  "ernestod1998"
          git config user.email "61074783+ernestod1998@users.noreply.github.com"
          python ci_commit_push.py \
            --message "chore: update boards listings [$(date -u '+%Y-%m-%d %H:%MZ')]" \
            boards_jobs.json boards_jobs.md boards_jobs.html \
            workflow_runs.jsonl all_jobs.json notified.json
