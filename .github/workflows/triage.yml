name: Daily Resume Ranking
on:
  workflow_dispatch:
    inputs:
      luna:
        description: 'Maximum Luna attempts this run (daily cap 50)'
        default: '50'
      sonnet:
        description: 'Maximum Sonnet attempts this run (daily cap 5)'
        default: '5'
  schedule:
    - cron: '15 16,17 * * *'
concurrency:
  group: job-scraper-daily-ranking
  cancel-in-progress: false
jobs:
  rank:
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_RANKING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-benchmark.txt
      - name: Configure ranking publisher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Rank new jobs and review strongest matches
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RANKING_INPUTS: ${{ secrets.RANKING_INPUTS }}
          RANKING_RESEARCH_RESUME: ${{ secrets.RANKING_RESEARCH_RESUME }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_LUNA: ${{ inputs.luna }}
          RUN_SONNET: ${{ inputs.sonnet }}
        run: python -B daily_rankings.py
      - name: Publish sanitized rankings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ranking_results.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            python ci_commit_push.py --message 'chore: publish daily resume rankings' ranking_results.json
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          fi
