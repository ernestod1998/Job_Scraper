name: Startup Discovery

on:
  schedule:
    # Mondays 12:27 UTC — off-hour minute avoids GitHub Actions throttling at :00.
    - cron: "27 12 * * 1"

  workflow_dispatch:

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  discover:
    name: Discover startups from portfolios
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discover startups (SOSV/IndieBio portfolio) and update the seed file
        run: python discover.py --portfolios --write

      - name: Commit discovered companies to repo
        run: |
          git config user.name  "ernestod1998"
          git config user.email "61074783+ernestod1998@users.noreply.github.com"
          git add discovered_companies.json
          git diff --cached --quiet || git commit -m "chore: update discovered startups [$(date -u '+%Y-%m-%d')]"
          git pull --rebase origin main
          git push
